<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="prmnum.css">
</head>
<body>
     <h1>palindrome</h1>
    <div class="box">
        <input type="text" name="n1" id="n1">
        <button type="button" onclick="output()">Check</button>
         <h3 id="ans"></h3>
    </div>
</body>
    <script>
        function output() {
        let num = Number(document.getElementById("n1").value);

    let temp = num;
    let rev = 0;

    while (temp > 0) {
        let digit = temp % 10;
        rev = rev * 10 + digit;
        temp = Math.floor(temp / 10);
    }

    if (num == rev) {
        document.getElementById("ans").innerHTML = "Palindrome Number";
    } else {
        document.getElementById("ans").innerHTML = "Not a Palindrome Number";
    }
}
    </script>
</html>
