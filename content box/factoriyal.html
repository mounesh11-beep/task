<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="prmnum.css">
</head>
<body>
    <h1>Factoriyal Number</h1>
    <div class="box">
        <input type="text" name="n1" id="n1">
        <button type="button" onclick="output()">Check</button>
         <h3 id="ans"></h3>
    </div>
</body>
<script>
    function output() {
    let num = Number(document.getElementById("n1").value);

    let fact = 1;
    let i = 1;
    while (fact < num) {
        i++;
        fact = fact * i;
    }

    if (fact == num) {
        document.getElementById("ans").innerHTML =
            "Factorial Number";
    } 
    else {
        document.getElementById("ans").innerHTML =
            "Not a Factorial Number";
    }
}
</script>
</html>
